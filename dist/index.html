<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ритм — планирование команды</title><link rel="stylesheet" href="style.css"></head><body>
<main><div class="topbar"><div class="sync-toolbar"><span class="save-state" id="saveState" role="status">● Подключение…</span><button class="backup-button" id="exportPlan" title="Скачать резервную копию плана" aria-label="Скачать резервную копию">↓</button><button class="sheet-button" id="migrateLocalPlan" hidden>Перенести локальный план</button></div><div class="year-controls"><button id="prev" aria-label="Предыдущие шесть месяцев">‹</button><strong id="period"></strong><button id="next" aria-label="Следующие шесть месяцев">›</button><button class="today" id="today">Начало года</button></div></div>
<section class="overview"><div class="section-title"><h2>Загрузка команды <span id="teamCount"></span></h2><div class="load-period"><span class="live-dot"></span><label for="summarySprint">За спринт</label><select id="summarySprint"></select></div></div><div class="summary-body"><div class="summary-stat"><span>Средняя загрузка</span><strong id="average">0<small>%</small></strong><div id="capacityText">Есть место для новых задач</div></div><div class="people-scroll" id="people"></div></div><div class="overview-footer"><span><i class="legend-dot"></i> До 80% — есть резерв</span><span><i class="legend-dot full"></i> 80–100% — оптимально</span><span><i class="legend-dot over"></i> Больше 100% — перегрузка</span><span class="only-task">Пока учитывается одна задача</span></div></section>
<section class="plan"><div class="plan-top"><div class="section-title"><h2>Таймлайн <span id="taskCount"></span></h2><button class="sheet-button" id="addTask">＋ Задача</button><button class="sheet-button undo-task" id="undoDelete" disabled title="Вернуть последнюю удалённую задачу">↶ Вернуть</button></div><div class="product-filters" id="productFilters" role="group" aria-label="Фильтр по продукту"></div><div class="zoom-controls" role="group" aria-label="Масштаб таймлайна"><label title="Alt + ←/→"><span>↔</span><input id="zoomX" type="range" min="50" max="300" step="10" value="100" aria-label="Горизонтальный масштаб"><output id="zoomXValue" for="zoomX">100%</output></label><label title="Alt + ↑/↓"><span>↕</span><input id="zoomY" type="range" min="75" max="250" step="5" value="100" aria-label="Вертикальный масштаб"><output id="zoomYValue" for="zoomY">100%</output></label><button id="resetZoom" title="Сбросить масштаб · Alt + 0" aria-label="Сбросить масштаб">↺</button></div></div><div class="timeline-scroll"><div class="timeline"><div class="timeline-head"><div class="task-col-heading"><span>ЗАДАЧА / ПРОДУКТ</span><button class="pin-column" id="pinTaskColumn" aria-label="Открепить колонку задач" aria-pressed="true" title="Открепить колонку задач"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path class="lock-shackle" d="M5 7V5a3 3 0 0 1 6 0v2"/><rect x="3.5" y="7" width="9" height="7" rx="1.5"/><path d="M8 10v1.5"/></svg></button></div><div class="months" id="months"></div></div><div class="sprint-head"><div class="task-count"></div><div class="sprints" id="sprints"></div></div><div id="taskRows"></div><button class="empty-tasks" id="emptyTasks" hidden>＋ Добавить первую задачу</button></div></div>
<div class="detail-panel" aria-labelledby="allocationTitle"><div class="detail-heading"><h2 id="allocationTitle"><button id="toggleAssignees" class="detail-toggle" aria-expanded="true" aria-controls="assigneesBody"><span class="detail-chevron" aria-hidden="true">⌄</span>Исполнители</button></h2><span class="selected-task-name" id="selectedTaskName"></span></div><div class="detail-layout" id="assigneesBody"><div class="allocation"><div class="allocation-header"><span>УЧАСТНИК</span><span>ЗАГРУЗКА НА СПРИНТ</span><span></span></div><div id="allocations"></div><div class="add-person"><button id="addPerson">＋ Назначить участника</button><div class="person-picker" id="personPicker" hidden><input id="personSearch" placeholder="Найти в команде…" aria-label="Поиск участника"><div id="personOptions"></div></div></div></div></div></div></section></main><script src="vendor/supabase.js"></script><script src="config.js"></script><script src="sync-core.js"></script><script src="cloud-sync.js"></script><script src="app.js"></script></body></html>
